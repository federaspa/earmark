[project]
name = "earmark"
version = "0.1.0"
description = "Record Teams meetings, transcribe locally, file notes into Obsidian."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rumps>=0.4",
    "mlx-whisper>=0.4",
    "numpy>=1.26",
    "python-docx>=1.1",
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
